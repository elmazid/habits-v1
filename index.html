<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Daily Protocol</title>

  <!-- Konfigurasi PWA & Home Screen iOS -->
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-title" content="Protocol">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090B">

  <!-- Font Presisi: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #09090B;
      --bg-surface: #121215;
      --bg-surface-hover: #18181C;
      --bg-elevated: #1C1C22;
      --border-subtle: #222228;
      --border-focus: #3F3F46;
      
      --text-primary: #F4F4F5;
      --text-secondary: #A1A1AA;
      --text-muted: #52525B;
      
      --accent-neutral: #E4E4E7;
      --accent-emerald: #10B981;
      --accent-emerald-dim: rgba(16, 185, 129, 0.12);
      --accent-gold: #F59E0B;
      --accent-gold-dim: rgba(245, 158, 11, 0.14);
      
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 24px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
      padding-top: calc(var(--safe-top) + 16px);
      padding-bottom: calc(var(--safe-bottom) + 40px);
      padding-left: 18px;
      padding-right: 18px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-wrapper {
      max-width: 480px;
      margin: 0 auto;
    }

    /* HEADER & STATUS BAR */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .date-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .day-label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
    }

    .date-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      transition: all 0.3s ease;
    }

    .streak-pill.active-streak {
      border-color: rgba(245, 158, 11, 0.4);
      background: var(--accent-gold-dim);
      color: var(--accent-gold);
    }

    /* DASHBOARD CARD (MOTIVASI & PROGRES) */
    .dashboard-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s ease;
    }

    .dashboard-card.state-80 {
      border-color: rgba(16, 185, 129, 0.35);
    }

    .dashboard-card.state-100 {
      border-color: rgba(245, 158, 11, 0.45);
    }

    .quote-box {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.55;
      margin-bottom: 16px;
      padding-left: 11px;
      border-left: 2px solid var(--border-focus);
      transition: border-color 0.3s ease;
    }

    .dashboard-card.state-80 .quote-box {
      border-left-color: var(--accent-emerald);
    }

    .dashboard-card.state-100 .quote-box {
      border-left-color: var(--accent-gold);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .progress-fraction {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .progress-percent {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      transition: color 0.3s ease;
    }

    .dashboard-card.state-80 .progress-percent {
      color: var(--accent-emerald);
    }

    .dashboard-card.state-100 .progress-percent {
      color: var(--accent-gold);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-elevated);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-neutral);
      border-radius: 999px;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s ease;
    }

    .dashboard-card.state-80 .progress-fill {
      background: var(--accent-emerald);
    }

    .dashboard-card.state-100 .progress-fill {
      background: var(--accent-gold);
    }

    /* 80% THRESHOLD MARKER */
    .threshold-marker {
      position: absolute;
      left: 80%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(9, 9, 11, 0.7);
      z-index: 2;
    }

    /* 7-DAY MINI HEATMAP */
    .heatmap-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
    }

    .heatmap-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .heatmap-day-name {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .heatmap-cell.is-today .heatmap-day-name {
      color: var(--text-primary);
      font-weight: 700;
    }

    .heatmap-box {
      width: 100%;
      height: 22px;
      border-radius: 6px;
      background: var(--bg-elevated);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      transition: all 0.25s ease;
    }

    .heatmap-cell.is-today .heatmap-box {
      border-color: var(--border-focus);
      color: var(--text-secondary);
    }

    .heatmap-box.level-partial {
      background: rgba(228, 228, 231, 0.08);
      color: var(--text-secondary);
    }

    .heatmap-box.level-streak {
      background: var(--accent-emerald-dim);
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--accent-emerald);
      font-weight: 600;
    }

    .heatmap-box.level-perfect {
      background: var(--accent-gold-dim);
      border-color: rgba(245, 158, 11, 0.5);
      color: var(--accent-gold);
      font-weight: 700;
    }

    /* KATEGORI & FILTER BAR */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 12px;
      padding: 0 2px;
    }

    .section-info {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .filter-toggle {
      background: none;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-toggle.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--border-focus);
    }

    /* HABIT GROUPS & CARDS */
    .phase-group {
      margin-bottom: 20px;
    }

    .phase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .phase-title {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
    }

    .phase-counter {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .habit-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 13px 14px;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.2s ease, border-color 0.2s ease, opacity 0.25s ease;
    }

    .habit-item:active {
      transform: scale(0.985);
    }

    .habit-item.completed {
      background: rgba(18, 18, 21, 0.45);
      border-color: rgba(34, 34, 40, 0.5);
      opacity: 0.52;
    }

    .habit-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .checkbox-ring {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1.75px solid var(--border-focus);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: rgba(255, 255, 255, 0.01);
    }

    .habit-item.completed .checkbox-ring {
      background: var(--accent-emerald);
      border-color: var(--accent-emerald);
    }

    .check-svg {
      width: 13px;
      height: 13px;
      stroke: var(--bg-base);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .habit-item.completed .check-svg {
      opacity: 1;
      transform: scale(1);
    }

    .habit-text-wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .habit-name {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s ease;
    }

    .habit-item.completed .habit-name {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .habit-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .schedule-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }

    .edit-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 5px;
      margin-left: 8px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .edit-btn:active {
      background: var(--border-focus);
      color: var(--text-primary);
    }

    /* FOOTER INFO */
    .footer-meta {
      margin-top: 32px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
    <body>
  <div class="app-wrapper">
    <!-- HEADER -->
    <header class="header-top">
      <div class="date-block">
        <span class="day-label" id="day-label">MEMUAT...</span>
        <h1 class="date-title" id="date-title">...</h1>
      </div>
      <div class="streak-pill" id="streak-pill" title="Streak aktif jika progres harian minimal 80%">
        <span>🔥</span>
        <span id="streak-count">0d</span>
      </div>
    </header>

    <!-- DASHBOARD MOTIVASI & PROGRES -->
    <section class="dashboard-card" id="dashboard-card">
      <div class="quote-box" id="quote-box">
        Memuat protokol harian...
      </div>

      <div class="progress-meta">
        <span class="progress-fraction" id="progress-fraction">0 / 0 SELESAI</span>
        <span class="progress-percent" id="progress-percent">0%</span>
      </div>

      <div class="progress-track">
        <div class="threshold-marker" title="Batas minimal 80% untuk menjaga Streak"></div>
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <!-- 7-DAY MINI HEATMAP -->
      <div class="heatmap-row" id="heatmap-row"></div>
    </section>

    <!-- BAR KONTROL -->
    <div class="controls-bar">
      <span class="section-info" id="section-info">TARGET HARI INI</span>
      <button class="filter-toggle" id="btn-toggle-all" onclick="toggleShowAllDays()">
        Lihat Semua (16)
      </button>
    </div>

    <!-- DAFTAR HABIT PER FASE -->
    <main id="habits-container"></main>

    <!-- FOOTER -->
    <footer class="footer-meta">
      <span>AUTO-RESET SETIAP 03:30 • STREak THRESHOLD 80%</span>
    </footer>
  </div>

  <script>
    // ==========================================
    // 1. KONFIGURASI & DATABASE HABIT
    // ==========================================
    const STORAGE_KEY = 'daily_protocol_data_v1';
    let showAllMode = false;

    // 0 = Ahad, 1 = Senin, 2 = Selasa, 3 = Rabu, 4 = Kamis, 5 = Jumat, 6 = Sabtu
    const DEFAULT_HABITS = [
      // FASE 1: PAGI & FISIK
      { id: 'h_hafalan_quran', title: '🌅 Hafalan Juz 6', phase: 'Pagi & Fisik', days: [0,1,2,3,4,5,6], editable: true },
      { id: 'h_murojaah_quran', title: '🌅 Murojaah Juz 6', phase: 'Pagi & Fisik', days: [0,1,2,3,4,5,6], editable: true },
      { id: 'h_workout', title: '💪🏻 Workout', phase: 'Pagi & Fisik', days: [0,1,2,3,4,5,6], editable: false },

      // FASE 2: FOKUS SIANG
      { id: 'h_belajar_1', title: '☀️ Belajar Sesi 1', phase: 'Fokus Siang', days: [0,1,2,3,4,5,6], editable: false },
      { id: 'h_belajar_2', title: '☀️ Belajar Sesi 2', phase: 'Fokus Siang', days: [0,1,2,3,4,5,6], editable: false },

      // FASE 3: LITERASI & TALAQQI ILMU
      { id: 'h_fiqih', title: '📖 Baca Fiqih', phase: 'Literasi & Ilmu', days: [0,1,2,3,4,5,6], editable: true },
      { id: 'h_tafsir', title: '📖 Baca Tafsir', phase: 'Literasi & Ilmu', days: [0,1,2,3,4,5,6], editable: true },
      { id: 'h_hadits_baca', title: '📖 Baca Hadits', phase: 'Literasi & Ilmu', days: [0,1,2,3,4,5,6], editable: true },
      { id: 'h_arabic', title: '📚 Learning Arabic', phase: 'Literasi & Ilmu', days: [0,1,2,3,4,5,6], editable: false },
      { id: 'h_math', title: '📐 Learning Math', phase: 'Literasi & Ilmu', days: [5,6], scheduleLabel: 'Jumat–Sabtu', editable: false },

      // FASE 4: SORE & PENJAGAAN
      { id: 'h_juz_awal', title: '🕒 Murojaah Juz Awal', phase: 'Sore & Penjagaan', days: [0,1,2,3,4,5,6], editable: true },
      { id: 'h_juz_akhir', title: '🕒 Murojaah Juz Akhir', phase: 'Sore & Penjagaan', days: [0,1,2,3,4,5,6], editable: true },
      { id: 'h_hafalan_hadits', title: '📜 Hafalan Hadits', phase: 'Sore & Penjagaan', days: [0,2,4], scheduleLabel: 'Ahad, Selasa, Kamis', editable: true },
      { id: 'h_murojaah_hadits', title: '📜 Murojaah Hadits', phase: 'Sore & Penjagaan', days: [1,3,5,6], scheduleLabel: 'Senin, Rabu, Jum–Sab', editable: true },

      // FASE 5: MALAM & PENUTUP
      { id: 'h_belajar_3', title: '🌙 Belajar Sesi 3', phase: 'Malam & Penutup', days: [0,1,2,3,4,5,6], editable: false },
      { id: 'h_bacaan_ringan', title: '🌙 Bacaan Ringan', phase: 'Malam & Penutup', days: [0,1,2,3,4,5,6], editable: false }
    ];

    // ==========================================
    // 2. KALIMAT PENYEMANGAT KONTEKSTUAL
    // ==========================================
    const QUOTES = {
      start: [
        "Momentum hari ini ditentukan dari jam pertamamu. Eksekusi satu yang paling berat.",
        "Jangan bernegosiasi dengan rasa malas di waktu pagi. Mulai saja dulu.",
        "Ilmu dan ketajaman berpikir tidak didapat dengan tubuh yang santai. Buka lembaran pertamamu.",
        "Fokus pada satu kotak centang pertama. Gerakan kecil mengalahkan niat besar yang diam."
      ],
      mid: [
        "Separuh jalan. Jaga ritme, jangan biarkan waktu bocor ke hal yang tidak memberi nilai.",
        "Sedikit tapi kontinu jauh lebih tajam daripada banyak tapi terputus.",
        "Konsistensi di jam-jam lelah inilah yang membedakan hasil akhir.",
        "Progres sedang berjalan. Tutup celah distraksi, selesaikan satu fase lagi."
      ],
      near: [
        "Sudah di atas 70%. Tinggal beberapa langkah lagi untuk mengunci hari ini dengan bersih.",
        "Jangan beri diskon di ujung hari. Tuntaskan apa yang sudah kamu mulai tadi pagi.",
        "Rasa lelah itu hilang setelah istirahat, tapi catatan disiplin hari ini permanen.",
        "Sedikit lagi menembus batas aman. Selesaikan sisanya dengan tenang."
      ],
      late_rescue: [
        "Hari belum berakhir sampai 03:30. Ambil apa yang masih bisa diselamatkan malam ini.",
        "Hari yang padat? Tidak masalah. Cicil yang paling ringan, jangan biarkan hari ini tertutup nol.",
        "Masih ada waktu sebelum pergantian hari. Amankan target inti yang belum tersentuh."
      ],
      done: [
        "Target hari ini tuntas 100% tanpa hutang. Istirahat dengan tenang, besok kita jaga lagi.",
        "Disiplin terjaga penuh. Satu batu bata lagi berhasil dipasang hari ini.",
        "Protokol harian selesai sempurna. Nikmati waktu istirahatmu."
      ]
    };

    // ==========================================
    // 3. MESIN WAKTU (AUTO-RESET 03:30 DINI HARI)
    // ==========================================
    function getLogicalDateObj(offsetDays = 0) {
      const now = new Date();
      // Mundurkan 3 jam 30 menit agar pukul 00:00 - 03:29 masih terhitung hari sebelumnya
      const shifted = new Date(now.getTime() - (3 * 60 + 30) * 60 * 1000);
      if (offsetDays !== 0) {
        shifted.setDate(shifted.getDate() + offsetDays);
      }
      return shifted;
    }

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function loadAppState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { customTitles: {}, history: {} };
        const parsed = JSON.parse(raw);
        return {
          customTitles: parsed.customTitles || {},
          history: parsed.history || {}
        };
      } catch (e) {
        return { customTitles: {}, history: {} };
      }
    }

    function saveAppState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
// ==========================================
    // 4. EFEK SUARA TAKTIL (WEB AUDIO SYNTHESIS)
    // ==========================================
    let audioCtx = null;

    function playTactileClick(isChecking = true) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        // Frekuensi naik saat centang (dopamine cue), turun saat batal
        osc.type = 'triangle';
        if (isChecking) {
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.045);
        } else {
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(260, now + 0.04);
        }

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.055);
      } catch (e) {
        // Abaikan jika perangkat dalam mode bisu ketat
      }
    }

    // ==========================================
    // 5. KALKULASI PROGRES, STREAK & MOTIVASI
    // ==========================================
    function getScheduledHabitsForDay(dayIndex) {
      return DEFAULT_HABITS.filter(h => h.days.includes(dayIndex));
    }

    function getDayStats(dateObj, state) {
      const dateKey = formatDateKey(dateObj);
      const dayIndex = dateObj.getDay();
      const scheduled = getScheduledHabitsForDay(dayIndex);
      const completedMap = state.history[dateKey] || {};

      let doneCount = 0;
      scheduled.forEach(h => {
        if (completedMap[h.id]) doneCount++;
      });

      const total = scheduled.length;
      const percent = total > 0 ? Math.round((doneCount / total) * 100) : 0;

      return { dateKey, dayIndex, doneCount, total, percent, completedMap };
    }

    function calculateCurrentStreak(state) {
      let streak = 0;
      const todayStats = getDayStats(getLogicalDateObj(0), state);

      // Jika hari ini sudah >= 80%, hitung mulai dari hari ini
      // Jika belum, hitung mulai dari kemarin agar streak tidak terlihat 0 di pagi hari
      let startOffset = todayStats.percent >= 80 ? 0 : -1;

      for (let i = startOffset; i >= -365; i--) {
        const dObj = getLogicalDateObj(i);
        const stats = getDayStats(dObj, state);
        if (stats.percent >= 80) {
          streak++;
        } else {
          break;
        }
      }
      return streak;
    }

    function getContextualQuote(percent, dateKey) {
      const now = new Date();
      const hour = now.getHours();
      let pool = QUOTES.start;

      if (percent === 100) {
        pool = QUOTES.done;
      } else if (percent >= 70) {
        pool = QUOTES.near;
      } else if ((hour >= 20 || hour < 3) && percent < 45) {
        pool = QUOTES.late_rescue;
      } else if (percent >= 20) {
        pool = QUOTES.mid;
      } else {
        pool = QUOTES.start;
      }

      // Pilihan konsisten berdasarkan tanggal + progres agar kalimat tidak melompat liar
      const seed = dateKey.split('-').reduce((a, b) => a + Number(b), 0) + Math.floor(percent / 20);
      return pool[seed % pool.length];
    }

    // ==========================================
    // 6. AKSI INTERAKTIF PENGGUNA
    // ==========================================
    function toggleHabit(habitId) {
      const state = loadAppState();
      const todayObj = getLogicalDateObj(0);
      const todayKey = formatDateKey(todayObj);

      if (!state.history[todayKey]) {
        state.history[todayKey] = {};
      }

      const nextStatus = !state.history[todayKey][habitId];
      if (nextStatus) {
        state.history[todayKey][habitId] = true;
      } else {
        delete state.history[todayKey][habitId];
      }

      playTactileClick(nextStatus);
      saveAppState(state);
      renderApp();
    }

    function editHabitTitle(event, habitId) {
      event.stopPropagation();
      const state = loadAppState();
      const baseHabit = DEFAULT_HABITS.find(h => h.id === habitId);
      if (!baseHabit) return;

      const currentTitle = state.customTitles[habitId] || baseHabit.title;
      const updated = prompt('Ubah nama target habit (kosongkan untuk kembali ke default):', currentTitle);

      if (updated === null) return; // Batal
      const trimmed = updated.trim();

      if (trimmed === '' || trimmed === baseHabit.title) {
        delete state.customTitles[habitId];
      } else {
        state.customTitles[habitId] = trimmed;
      }

      saveAppState(state);
      renderApp();
    }

    function toggleShowAllDays() {
      showAllMode = !showAllMode;
      renderApp();
    }

    // ==========================================
    // 7. RENDER UI & HEATMAP
    // ==========================================
    const DAY_NAMES_FULL = ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const DAY_NAMES_SHORT = ['AHD', 'SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB'];
    const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

    function renderHeatmap(state) {
      const container = document.getElementById('heatmap-row');
      let html = '';

      // Menampilkan 7 hari terakhir (dari H-6 sampai Hari Ini)
      for (let offset = -6; offset <= 0; offset++) {
        const dObj = getLogicalDateObj(offset);
        const stats = getDayStats(dObj, state);
        const isToday = offset === 0;
        const shortDay = DAY_NAMES_SHORT[dObj.getDay()];

        let boxClass = 'heatmap-box';
        let label = stats.percent > 0 ? `${stats.percent}%` : '·';

        if (stats.percent === 100) {
          boxClass += ' level-perfect';
          label = '100';
        } else if (stats.percent >= 80) {
          boxClass += ' level-streak';
        } else if (stats.percent > 0) {
          boxClass += ' level-partial';
        }

        html += `
          <div class="heatmap-cell ${isToday ? 'is-today' : ''}">
            <span class="heatmap-day-name">${shortDay}</span>
            <div class="${boxClass}">${label}</div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderApp() {
      const state = loadAppState();
      const todayObj = getLogicalDateObj(0);
      const stats = getDayStats(todayObj, state);

      // 1. Render Header Tanggal
      const dayName = DAY_NAMES_FULL[todayObj.getDay()];
      const dateStr = `${todayObj.getDate()} ${MONTH_NAMES[todayObj.getMonth()]} ${todayObj.getFullYear()}`;
      document.getElementById('day-label').textContent = `PROTOKOL ${dayName.toUpperCase()}`;
      document.getElementById('date-title').textContent = dateStr;

      // 2. Render Streak Pill
      const streak = calculateCurrentStreak(state);
      const streakPill = document.getElementById('streak-pill');
      document.getElementById('streak-count').textContent = `${streak}d`;
      if (streak > 0 || stats.percent >= 80) {
        streakPill.classList.add('active-streak');
      } else {
        streakPill.classList.remove('active-streak');
      }

      // 3. Render Dashboard State, Quote & Progress Bar
      const dashCard = document.getElementById('dashboard-card');
      dashCard.classList.remove('state-80', 'state-100');
      if (stats.percent === 100) {
        dashCard.classList.add('state-100');
      } else if (stats.percent >= 80) {
        dashCard.classList.add('state-80');
      }

      document.getElementById('quote-box').textContent = getContextualQuote(stats.percent, stats.dateKey);
      document.getElementById('progress-fraction').textContent = `${stats.doneCount} / ${stats.total} SELESAI`;
      document.getElementById('progress-percent').textContent = `${stats.percent}%`;
      document.getElementById('progress-fill').style.width = `${stats.percent}%`;

      // 4. Render 7-Day Heatmap
      renderHeatmap(state);

      // 5. Render Filter Info
      const toggleBtn = document.getElementById('btn-toggle-all');
      const sectionInfo = document.getElementById('section-info');
      if (showAllMode) {
        toggleBtn.classList.add('active');
        toggleBtn.textContent = 'Hanya Hari Ini';
        sectionInfo.textContent = 'SEMUA DAFTAR (16 ITEM)';
      } else {
        toggleBtn.classList.remove('active');
        toggleBtn.textContent = `Lihat Semua (${DEFAULT_HABITS.length})`;
        sectionInfo.textContent = `JADWAL ${dayName.toUpperCase()} (${stats.total} ITEM)`;
      }

      // 6. Render Daftar Habit per Fase
      const visibleHabits = showAllMode
        ? DEFAULT_HABITS
        : getScheduledHabitsForDay(stats.dayIndex);

      const phasesOrder = ['Pagi & Fisik', 'Fokus Siang', 'Literasi & Ilmu', 'Sore & Penjagaan', 'Malam & Penutup'];
      const container = document.getElementById('habits-container');
      let groupsHtml = '';

      phasesOrder.forEach(phaseName => {
        const itemsInPhase = visibleHabits.filter(h => h.phase === phaseName);
        if (itemsInPhase.length === 0) return;

        const doneInPhase = itemsInPhase.filter(h => stats.completedMap[h.id]).length;

        let itemsHtml = '';
        itemsInPhase.forEach(habit => {
          const isDone = Boolean(stats.completedMap[habit.id]);
          const isScheduledToday = habit.days.includes(stats.dayIndex);
          const displayTitle = state.customTitles[habit.id] || habit.title;

          let badgeHtml = '';
          if (habit.scheduleLabel) {
            const statusNote = !isScheduledToday ? ' • Off hari ini' : '';
            badgeHtml = `
              <div class="habit-badge-row">
                <span class="schedule-tag">${habit.scheduleLabel}${statusNote}</span>
              </div>
            `;
          }

          const editBtnHtml = habit.editable
            ? `<button class="edit-btn" onclick="editHabitTitle(event, '${habit.id}')">Edit</button>`
            : '';

          itemsHtml += `
            <div class="habit-item ${isDone ? 'completed' : ''}" onclick="toggleHabit('${habit.id}')">
              <div class="habit-left">
                <div class="checkbox-ring">
                  <svg class="check-svg" viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <div class="habit-text-wrap">
                  <span class="habit-name">${displayTitle}</span>
                  ${badgeHtml}
                </div>
              </div>
              ${editBtnHtml}
            </div>
          `;
        });

        groupsHtml += `
          <div class="phase-group">
            <div class="phase-header">
              <span class="phase-title">${phaseName}</span>
              <span class="phase-counter">${doneInPhase}/${itemsInPhase.length}</span>
            </div>
            <div class="habit-list">
              ${itemsHtml}
            </div>
          </div>
        `;
      });

      container.innerHTML = groupsHtml;
    }

    // ==========================================
    // 8. INISIALISASI & AUTO-WAKE CHECK
    // ==========================================
    let activeDateKey = formatDateKey(getLogicalDateObj(0));

    function checkRollover() {
      const currentKey = formatDateKey(getLogicalDateObj(0));
      if (currentKey !== activeDateKey) {
        activeDateKey = currentKey;
        renderApp();
      }
    }

    // Render pertama kali saat dibuka
    renderApp();

    // Cek pergantian hari otomatis saat aplikasi dibuka dari background iOS
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        checkRollover();
        renderApp();
      }
    });

    // Cek berkala setiap 30 detik jika layar terus menyala melewati pukul 03:30
    setInterval(checkRollover, 30000);
  </script>
</body>
